{% load static %}
<nav class="nav {{ nav_class }}" id="nav">
  <div class="nav__inner">
    <a href="{% url 'home' %}" class="nav__logo">{{ site.logo_text }}</a>

    <div class="nav__links">
      <a href="{% url 'home' %}"      {% if request.resolver_match.url_name == 'home'      %}class="active"{% endif %}>Home</a>
      <a href="{% url 'portfolio' %}" {% if request.resolver_match.url_name == 'portfolio'  %}class="active"{% endif %}>Portfolio</a>
      <a href="{% url 'projects' %}"  {% if request.resolver_match.url_name == 'projects'   %}class="active"{% endif %}>Projects</a>
      <a href="{% url 'blog' %}"      {% if request.resolver_match.url_name == 'blog'       %}class="active"{% endif %}>Blog</a>
      <a href="{% url 'contact' %}"   {% if request.resolver_match.url_name == 'contact'    %}class="active"{% endif %}>Contact</a>
    </div>

    <div class="nav__cta">
      <a href="{{ site.donate_url }}" class="btn btn-gold">Donate</a>
    </div>

    <button class="nav__hamburger" id="hamburger" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- Mobile Drawer -->
<div class="nav__drawer" id="drawer">
  <a href="{% url 'home' %}">Home</a>
  <a href="{% url 'portfolio' %}">Portfolio</a>
  <a href="{% url 'projects' %}">Projects</a>
  <a href="{% url 'blog' %}">Blog</a>
  <a href="{% url 'contact' %}">Contact</a>
  <a href="{{ site.donate_url }}" class="btn btn-gold" style="margin-top:1rem;justify-content:center;">Donate</a>
</div>
