{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Campaign Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      min-height: 100vh;
      background: #183931;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Decorative rings ── */
    .bg-ring {
      position: fixed;
      border-radius: 50%;
      border: 1px solid rgba(201,162,39,.08);
      pointer-events: none;
    }
    .bg-ring-1 { width: 700px; height: 700px; right: -200px; top: -200px; }
    .bg-ring-2 { width: 500px; height: 500px; right: -80px;  top: -80px; }
    .bg-ring-3 { width: 550px; height: 550px; left: -200px;  bottom: -200px; }
    .bg-bar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, transparent, #c9a227 50%, transparent);
      opacity: .4;
    }

    /* ── Card ── */
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
    }

    .login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 2.75rem 2.5rem 2rem;
      box-shadow: 0 32px 100px rgba(0,0,0,.4);
      animation: cardIn .5s cubic-bezier(.4,0,.2,1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Logo ── */
    .login-logo-ring {
      display: flex;
      justify-content: center;
      margin-bottom: 1.75rem;
    }
    .login-logo {
      width: 72px; height: 72px;
      background: #183931;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 800;
      color: #c9a227;
      letter-spacing: -.01em;
      box-shadow: 0 0 0 8px rgba(201,162,39,.12);
    }

    /* ── Heading ── */
    .login-title {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-title h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #183931;
      letter-spacing: -.025em;
      margin-bottom: .3rem;
    }
    .login-title p {
      font-size: .75rem;
      font-weight: 600;
      color: #7a7a8c;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* ── Error banner ── */
    .login-error {
      display: flex;
      align-items: center;
      gap: .6rem;
      background: #fde8e8;
      border: 1px solid #f5c6c6;
      border-radius: 10px;
      padding: .85rem 1rem;
      margin-bottom: 1.5rem;
      font-size: .84rem;
      font-weight: 600;
      color: #b91c1c;
    }
    .login-error .material-icons-round { font-size: 1.1rem; flex-shrink: 0; }

    /* ── Form fields ── */
    .field-group { margin-bottom: 1.25rem; }
    .field-group label {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #265e50;
      margin-bottom: .5rem;
    }
    .field-group label .material-icons-round { font-size: 1rem; color: #c9a227; }
    .field-group input {
      display: block;
      width: 100%;
      padding: .9rem 1.1rem;
      border: 1.5px solid #e0dbd0;
      border-radius: 10px;
      font-family: 'Montserrat', system-ui, sans-serif;
      font-size: .93rem;
      font-weight: 500;
      color: #183931;
      background: #f7f4ee;
      transition: border-color .2s, background .2s, box-shadow .2s;
      outline: none;
    }
    .field-group input:focus {
      border-color: #c9a227;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(201,162,39,.12);
    }

    /* ── Submit ── */
    .login-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      width: 100%;
      padding: 1rem;
      margin-top: 1.75rem;
      background: #183931;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-family: 'Montserrat', system-ui, sans-serif;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s, transform .2s, box-shadow .2s;
    }
    .login-submit:hover {
      background: #265e50;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(24,57,49,.3);
    }
    .login-submit .material-icons-round { font-size: 1.15rem; }

    /* ── Footer link ── */
    .login-footer {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid #ede9df;
      text-align: center;
    }
    .login-footer a {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-size: .76rem;
      font-weight: 600;
      color: #7a7a8c;
      text-decoration: none;
      letter-spacing: .04em;
      transition: color .2s;
    }
    .login-footer a:hover { color: #c9a227; }
    .login-footer .material-icons-round { font-size: .95rem; }
  </style>
</head>
<body>

  <!-- Background decoration -->
  <div class="bg-ring bg-ring-1"></div>
  <div class="bg-ring bg-ring-2"></div>
  <div class="bg-ring bg-ring-3"></div>
  <div class="bg-bar"></div>

  <div class="login-wrap">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo-ring">
        <div class="login-logo">NK</div>
      </div>

      <!-- Heading -->
      <div class="login-title">
        <h1>Campaign Admin</h1>
        <p>Nii Kpakpo &middot; Campaign 2025</p>
      </div>

      <!-- Error -->
      {% if form.errors %}
      <div class="login-error">
        <span class="material-icons-round">error</span>
        Incorrect username or password. Please try again.
      </div>
      {% endif %}

      <!-- Form -->
      <form method="post" action="{% url 'admin:login' %}{% if next %}?next={{ next }}{% endif %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="field-group">
          <label for="id_username">
            <span class="material-icons-round">person</span>
            Username
          </label>
          <input type="text" id="id_username" name="username"
                 value="{{ form.username.value|default:'' }}"
                 autocomplete="username" autofocus>
        </div>

        <div class="field-group">
          <label for="id_password">
            <span class="material-icons-round">lock</span>
            Password
          </label>
          <input type="password" id="id_password" name="password"
                 autocomplete="current-password">
        </div>

        <button type="submit" class="login-submit">
          <span class="material-icons-round">login</span>
          Sign In to Admin
        </button>
      </form>

      <!-- Footer -->
      <div class="login-footer">
        <a href="/" target="_blank">
          <span class="material-icons-round">public</span>
          View Campaign Website
        </a>
      </div>

    </div>
  </div>

</body>
</html>
