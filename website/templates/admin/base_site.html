{% extends "admin/base.html" %}

{% block title %}{{ title }} | Campaign Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
  <a href="{% url 'admin:index' %}">
    <span style="color:#c9a227;font-weight:800">Nii Kpakpo</span>
    <span style="color:rgba(255,255,255,.6);font-weight:400;font-size:.75em;margin-left:.5em">Campaign Admin</span>
  </a>
</h1>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
  /* ── Header ── */
  #header {
    background: #183931 !important;
    border-bottom: 3px solid #c9a227;
  }
  #branding h1 a,
  #branding h1 a:visited { color: #ffffff; font-family: system-ui, sans-serif; }

  /* ── Breadcrumbs ── */
  div.breadcrumbs {
    background: #265e50;
    color: rgba(255,255,255,.7);
  }
  div.breadcrumbs a { color: #c9a227; }
  div.breadcrumbs a:hover { color: #e8d68a; }

  /* ── Module headers ── */
  .module h2,
  .module caption,
  .inline-group h2 {
    background: #265e50;
    color: #ffffff;
    border-radius: 0;
  }

  /* ── Sidebar / nav ── */
  #nav-sidebar .module h2 {
    background: #265e50;
    color: rgba(255,255,255,.8);
    font-size: .75rem;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  /* ── Links ── */
  a:link, a:visited { color: #265e50; }
  a:hover { color: #c9a227; }

  /* ── Primary buttons (Save etc.) ── */
  .button,
  input[type=submit],
  input[type=button],
  .submit-row input,
  a.button {
    background: #265e50;
    border: 1px solid #265e50;
    border-radius: 4px;
    transition: background .2s;
  }
  .button:hover,
  input[type=submit]:hover,
  .submit-row input:hover {
    background: #428a76;
    border-color: #428a76;
  }

  /* "Save and continue" / default action ── */
  .button.default,
  input[type=submit].default,
  .submit-row input.default {
    background: #c9a227;
    border-color: #c9a227;
    color: #183931;
    font-weight: 700;
  }
  .button.default:hover,
  input[type=submit].default:hover {
    background: #ab8a21;
    border-color: #ab8a21;
  }

  /* ── Dashboard app tiles ── */
  .app-list .section:nth-child(1) .module { border-top: 3px solid #c9a227; }

  /* ── Table row hover ── */
  #result_list tbody tr:hover { background: #f7f4ee; }

  /* ── Selected checkbox rows ── */
  #result_list tbody tr.selected { background: #fbf3d9; }

  /* ── Fieldset headings ── */
  fieldset.module h2 {
    background: #183931;
    color: #c9a227;
    font-size: .8rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: .5rem 1rem;
  }

  /* ── Dashboard stat tiles (admin index) ── */
  .dashboard-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
    margin: 0 0 1.5rem;
  }
  .stat-tile {
    display: flex;
    align-items: center;
    gap: .9rem;
    padding: 1.1rem 1.3rem;
    border-radius: 12px;
    background: #ffffff;
    border: 1px solid #e5e1d6;
    box-shadow: 0 2px 10px rgba(24,57,49,.05);
    text-decoration: none;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .stat-tile:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(24,57,49,.12);
  }
  .stat-tile .material-icons-round {
    font-size: 1.6rem;
    width: 44px; height: 44px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    color: #ffffff;
  }
  .stat-tile--gold .material-icons-round   { background: #c9a227; }
  .stat-tile--navy .material-icons-round   { background: #265e50; }
  .stat-tile--forest .material-icons-round { background: #2d7664; }
  .stat-tile--outline .material-icons-round { background: #7a7a8c; }
  .stat-tile__body { display: flex; flex-direction: column; line-height: 1.3; }
  .stat-tile__body strong { font-size: 1.5rem; color: #183931; font-weight: 800; }
  .stat-tile__body span { font-size: .78rem; color: #7a7a8c; font-weight: 600; }

  /* ── Image thumbnails / previews ── */
  .admin-thumb {
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #ede9df;
    display: block;
  }
  .admin-image-preview {
    display: block;
    max-width: 320px;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid #ede9df;
    box-shadow: 0 4px 16px rgba(24,57,49,.12);
    margin-bottom: .5rem;
  }
  .no-thumb { color: #b7b2a4; font-size: .8rem; font-style: italic; }

  /* ── Status / boolean badges ── */
  .status-badge {
    display: inline-block;
    padding: .3rem .75rem;
    border-radius: 100px;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .03em;
    white-space: nowrap;
  }
  .status-badge--on  { color: #2d7664; background: #f1fbde; }
  .status-badge--off { color: #7a7a8c; background: #eceef2; }

  /* ── Changelist polish ── */
  #result_list { border-radius: 8px; overflow: hidden; }
  #result_list td, #result_list th { vertical-align: middle; }
</style>
{% endblock %}
